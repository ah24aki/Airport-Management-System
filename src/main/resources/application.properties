spring.application.name=AirportManagement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airport_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/airport-docs

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Optional local overrides (git-ignored), e.g. your real DB password
spring.config.import=optional:classpath:application-local.properties,optional:file:./src/main/resources/application-local.properties
